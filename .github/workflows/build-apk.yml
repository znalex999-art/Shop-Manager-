name: Build Shop Manager APK

# Runs automatically whenever you push code to GitHub, and can also be run
# manually from the "Actions" tab with the "Run workflow" button.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (already installed on this runner)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from resources/icon.png
        run: npx capacitor-assets generate --android

      - name: Sync web code + native plugins into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: shop-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
