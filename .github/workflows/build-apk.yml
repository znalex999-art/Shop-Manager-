name: Build Shop Manager APK

# Runs automatically whenever you push code to GitHub, and can also be run
# manually from the "Actions" tab with the "Run workflow" button.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses (already installed on this runner)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Replace default app icon with our logo (resources/icon.png)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          # Remove the default adaptive-icon XML so Android falls back to our plain PNG icons.
          rm -rf "$RES/mipmap-anydpi-v26"
          declare -A SIZES=( [mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192 )
          for dir in "${!SIZES[@]}"; do
            size="${SIZES[$dir]}"
            mkdir -p "$RES/$dir"
            convert resources/icon.png -resize ${size}x${size} "$RES/$dir/ic_launcher.png"
            convert resources/icon.png -resize ${size}x${size} "$RES/$dir/ic_launcher_round.png"
          done

      - name: Sync web code + native plugins into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: shop-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
