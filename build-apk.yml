name: Build Shop Manager APK

# Runs automatically whenever you push code to GitHub, and can also be run
# manually from the "Actions" tab with the "Run workflow" button.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (needed by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses (already installed on this runner)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add camera permission for QR scanning to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # <manifest ...> and <application ...> often span multiple lines, so a
          # line-based sed can insert text before the tag actually closes with
          # ">" and corrupt the XML. perl -0777 reads the whole file at once so
          # [^>]* can safely match across newlines up to the real closing ">".
          perl -0777 -pi -e 's#(<manifest\b[^>]*>)#$1\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#s' "$MANIFEST"
          perl -0777 -pi -e 's#(<application\b[^>]*>)#$1\n        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>#s' "$MANIFEST"
          echo "---- AndroidManifest.xml after patch ----"
          cat "$MANIFEST"

      - name: Make the WebView transparent so the live camera preview is visible
        run: |
          # The ML Kit barcode scanner draws its live camera preview natively,
          # BEHIND the WebView, and our JS makes the page background transparent
          # while scanning. But the WebView's own background still defaults to
          # opaque white/whatever was last drawn, so without this the user just
          # sees a frozen screenshot of the app instead of the camera feed.
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          echo "Patching $MAIN"
          perl -0777 -pi -e 's#(import com\.getcapacitor\.BridgeActivity;)#$1\nimport android.graphics.Color;\nimport android.os.Bundle;#' "$MAIN"
          perl -0777 -pi -e 's#(public class MainActivity extends BridgeActivity\s*\{)#$1\n  \@Override\n  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT);\n  }\n#' "$MAIN"
          echo "---- MainActivity.java after patch ----"
          cat "$MAIN"

      - name: Replace default app icon with our logo (resources/icon.png)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          # Remove the default adaptive-icon XML so Android falls back to our plain PNG icons.
          rm -rf "$RES/mipmap-anydpi-v26"
          declare -A SIZES=( [mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192 )
          for dir in "${!SIZES[@]}"; do
            size="${SIZES[$dir]}"
            mkdir -p "$RES/$dir"
            convert icon-1.png -resize ${size}x${size} "$RES/$dir/ic_launcher.png"
            convert icon-1.png -resize ${size}x${size} "$RES/$dir/ic_launcher_round.png"
          done

      - name: Sync web code + native plugins into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: shop-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
